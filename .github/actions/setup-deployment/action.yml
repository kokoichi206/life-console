name: Set up application deployment
description: 依存関係と適用済み Terraform output から Wrangler の設定を準備する
inputs:
  environments-json:
    description: 環境別の Terraform 入力
    required: true
  state-access-key-id:
    description: state 用 R2 access key
    required: true
  state-secret-access-key:
    description: state 用 R2 secret key
    required: true
runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Set up Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: "24"
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Set up Terraform
      uses: ./.github/actions/setup-terraform
      with:
        environments-json: ${{ inputs.environments-json }}
        state-access-key-id: ${{ inputs.state-access-key-id }}
        state-secret-access-key: ${{ inputs.state-secret-access-key }}

    - name: Read applied infrastructure outputs
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.state-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.state-secret-access-key }}
      run: terraform -chdir="$TF_ROOT" output -json > "$RUNNER_TEMP/terraform-outputs.json"

    - name: Prepare Wrangler configuration
      shell: bash
      run: |
        node --input-type=module <<'NODE'
        import { readFileSync, writeFileSync } from 'node:fs';
        const outputs = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/terraform-outputs.json`, 'utf8'));
        const configPath = `apps/api/wrangler.${process.env.DEPLOY_ENVIRONMENT}.jsonc`;
        const config = JSON.parse(readFileSync(`${configPath}.example`, 'utf8'));
        config.account_id = outputs.cloudflare_account_id.value;
        config.name = outputs.cloudflare_worker_name.value;
        config.d1_databases[0].database_id = outputs.cloudflare_d1_database_id.value;
        console.log(`::add-mask::${config.d1_databases[0].database_id}`);
        config.r2_buckets[0].bucket_name = outputs.cloudflare_r2_bucket_name.value;
        writeFileSync(configPath, `${JSON.stringify(config, null, 2)}\n`, { mode: 0o600 });
        // triggers の更新には build 成果物を使わず、公開経路と Cron の設定だけを渡す。
        const { name, account_id, workers_dev, preview_urls, routes, triggers } = config;
        writeFileSync(`${process.env.RUNNER_TEMP}/wrangler-triggers.json`, JSON.stringify({
          name, account_id, workers_dev, preview_urls, routes, triggers,
        }), { mode: 0o600 });
        NODE
