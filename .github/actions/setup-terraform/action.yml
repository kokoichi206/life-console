name: Set up Terraform
description: 対象環境の入力と R2 backend を準備する
inputs:
  environments-json:
    description: 環境別の Terraform 入力
    required: true
  state-access-key-id:
    description: state 用 R2 access key
    required: true
  state-secret-access-key:
    description: state 用 R2 secret key
    required: true
runs:
  using: composite
  steps:
    - name: Read Terraform version
      id: version
      shell: bash
      run: echo "version=$(awk '/^terraform /{print $2}' infra/terraform/.tool-versions)" >> "$GITHUB_OUTPUT"

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ steps.version.outputs.version }}
        terraform_wrapper: false

    - name: Prepare Terraform inputs
      shell: bash
      env:
        TERRAFORM_ENVIRONMENTS_JSON: ${{ inputs.environments-json }}
      run: |
        node --input-type=module <<'NODE'
        import { writeFileSync } from 'node:fs';
        const variables = JSON.parse(process.env.TERRAFORM_ENVIRONMENTS_JSON)[process.env.DEPLOY_ENVIRONMENT];
        for (const value of Object.values(variables)) {
          if (typeof value === 'string') {
            const escaped = value.replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
            console.log(`::add-mask::${escaped}`);
          }
        }
        writeFileSync(`${process.env.TF_ROOT}/terraform.tfvars.json`, JSON.stringify(variables), { mode: 0o600 });
        NODE

    - name: Initialize Terraform
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.state-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.state-secret-access-key }}
      run: terraform -chdir="$TF_ROOT" init -input=false -lockfile=readonly
