name: ci-github-workflows

on:
  push:
    branches:
      - develop
      - main
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/zizmor.yml"
  pull_request:
    branches:
      - develop
      - main
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/zizmor.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actions-lock:
    name: Verify workflow dependency lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify action dependencies
        run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}

  workflow-ci:
    permissions:
      contents: read
      actions: read
    uses: kokoichi206/gh-actions/.github/workflows/workflow-ci.yml@f85aa2c32988a93b44b1282168a7d69295575deb # fix/workflow-ci-lockfile-support
