name: ci-github-workflows

on:
  push:
    branches:
      - develop
      - main
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/zizmor.yml"
  pull_request:
    branches:
      - develop
      - main
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/zizmor.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actions-lock:
    name: Verify workflow dependency lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify action dependencies
        run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}

  zizmor:
    name: workflow-ci / zizmor static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v0.8.1
        with:
          # actions.lock と $/ 参照に対応した検査器を使う。
          version: "1.32.0"
          inputs: .github/workflows/
          online-audits: "true"
          advanced-security: "false"
          annotations: "true"

  workflow-lint:
    name: workflow-ci / workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Lint workflows
        uses: kokoichi206/gh-actions/lint-workflows@main
