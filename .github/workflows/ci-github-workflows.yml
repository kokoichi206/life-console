name: ci-github-workflows

on:
  push:
    branches:
      - develop
      - main
    paths:
      - ".github/workflows/**"
      - ".github/scripts/**"
  pull_request:
    branches:
      - develop
      - main
    paths:
      - ".github/workflows/**"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          version: "1.30.0"
          inputs: .github/workflows/
          online-audits: "true"
          advanced-security: "false"
          annotations: "true"

  workflow-lint:
    name: Workflow conventions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false

      - name: Test workflow linter
        run: uv run --script .github/scripts/lint-workflows.py --test

      - name: Lint workflows
        run: uv run --script .github/scripts/lint-workflows.py
