name: deploy

on:
  push:
    branches:
      - develop
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".agents/**"
      - ".claude/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    env:
      DEPLOY_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      VITE_APP_ENV: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check AI harness
        run: pnpm harness:check

      - name: Check migrations
        run: pnpm migrations:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit and storage tests
        run: pnpm test

      - name: Build Web
        run: pnpm --filter @life-console/web build

      - name: Build API
        run: pnpm --filter @life-console/api build

      - name: Build and smoke-test runner
        run: pnpm --filter @life-console/runner build

      - name: Build Storybook
        run: pnpm storybook:build

      - name: Install Chromium
        run: pnpm --filter @life-console/web exec playwright install --with-deps chromium

      - name: Test Storybook in Chromium
        run: pnpm storybook:test

      - name: Prepare deployment configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?対象 Environment の CLOUDFLARE_ACCOUNT_ID を設定してください}"
          : "${CLOUDFLARE_D1_DATABASE_ID:?対象 Environment の CLOUDFLARE_D1_DATABASE_ID を設定してください}"
          : "${CLOUDFLARE_R2_BUCKET_NAME:?対象 Environment の CLOUDFLARE_R2_BUCKET_NAME を設定してください}"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const configPath = `apps/api/wrangler.${process.env.DEPLOY_ENVIRONMENT}.jsonc`;
          const config = JSON.parse(readFileSync(`${configPath}.example`, 'utf8'));
          config.account_id = process.env.CLOUDFLARE_ACCOUNT_ID;
          config.d1_databases[0].database_id = process.env.CLOUDFLARE_D1_DATABASE_ID;
          config.r2_buckets[0].bucket_name = process.env.CLOUDFLARE_R2_BUCKET_NAME;
          // 各環境の初回配置で Access の保護を設定してから自動デプロイを有効にする。
          config.workers_dev = true;
          writeFileSync(configPath, `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - name: Validate deployment build
        run: pnpm --filter @life-console/api exec wrangler deploy --dry-run --config "wrangler.${DEPLOY_ENVIRONMENT}.jsonc"

      - name: Apply migrations and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?対象 Environment の CLOUDFLARE_API_TOKEN を設定してください}"
          pnpm --filter @life-console/api exec wrangler d1 migrations apply DB --remote --config "wrangler.${DEPLOY_ENVIRONMENT}.jsonc"
          pnpm --filter @life-console/api exec wrangler deploy --config "wrangler.${DEPLOY_ENVIRONMENT}.jsonc"
