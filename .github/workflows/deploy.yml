name: deploy

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: "false"
  TF_IN_AUTOMATION: "true"
  DEPLOY_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'development' }}
  TF_ROOT: infra/terraform/envs/${{ github.ref_name == 'main' && 'production' || 'development' }}

jobs:
  detect:
    name: Detect deployment changes
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      infra: ${{ steps.changes.outputs.infra }}
      application: ${{ steps.changes.outputs.application }}
      migration: ${{ steps.changes.outputs.migration }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Find last successful deployment
        id: baseline
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') return;
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'deploy.yml',
              branch: context.ref.replace('refs/heads/', ''),
              status: 'success',
              per_page: 1,
            });
            core.setOutput('sha', data.workflow_runs[0]?.head_sha ?? '');
      - name: Detect required jobs
        id: changes
        env:
          BASE_SHA: ${{ steps.baseline.outputs.sha }}
        run: |
          infra=false
          application=false
          migration=false
          # 初回・手動実行・履歴の分岐では、全工程を実行して基盤から揃える。
          if [[ -z "$BASE_SHA" ]] || ! git merge-base --is-ancestor "$BASE_SHA" "$GITHUB_SHA"; then
            infra=true
            application=true
            migration=true
          else
            while IFS= read -r -d '' file; do
              case "$file" in
                *.md)
                  ;;
                infra/terraform/*|.github/workflows/deploy.yml|.github/actions/*)
                  infra=true
                  application=true
                  migration=true
                  ;;
                apps/api/*|apps/web/*|packages/contracts/*|packages/core/*|packages/env/*|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|tsconfig*.json)
                  application=true
                  migration=true
                  ;;
                packages/db/migrations/*)
                  migration=true
                  ;;
              esac
            done < <(git diff --name-only -z "$BASE_SHA" "$GITHUB_SHA")
          fi
          {
            echo "infra=$infra"
            echo "application=$application"
            echo "migration=$migration"
          } >> "$GITHUB_OUTPUT"

  infra:
    name: Apply infrastructure
    needs:
      - detect
    if: needs.detect.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Set up Terraform
        uses: ./.github/actions/setup-terraform
        with:
          environments-json: ${{ secrets.TERRAFORM_ENVIRONMENTS_JSON }}
          state-access-key-id: ${{ secrets.TERRAFORM_STATE_ACCESS_KEY_ID }}
          state-secret-access-key: ${{ secrets.TERRAFORM_STATE_SECRET_ACCESS_KEY }}
      - name: Plan and apply infrastructure
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.TERRAFORM_CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TERRAFORM_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TERRAFORM_STATE_SECRET_ACCESS_KEY }}
        run: |
          terraform -chdir="$TF_ROOT" plan -input=false -lock-timeout=5m -out="$RUNNER_TEMP/infra.tfplan"
          # module ごと消した場合は prevent_destroy が効かないため、適用前にも確認する。
          terraform -chdir="$TF_ROOT" show -json "$RUNNER_TEMP/infra.tfplan" |
            jq -e 'all(.resource_changes[]?; .change.actions | index("delete") == null)' >/dev/null
          terraform -chdir="$TF_ROOT" apply -input=false -lock-timeout=5m "$RUNNER_TEMP/infra.tfplan"

  upload:
    name: Build and upload Worker version
    needs:
      - detect
      - infra
    if: ${{ !cancelled() && !failure() && needs.detect.outputs.application == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    outputs:
      version-id: ${{ steps.upload.outputs.version-id }}
    env:
      VITE_APP_ENV: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up deployment
        uses: ./.github/actions/setup-deployment
        with:
          environments-json: ${{ secrets.TERRAFORM_ENVIRONMENTS_JSON }}
          state-access-key-id: ${{ secrets.TERRAFORM_STATE_ACCESS_KEY_ID }}
          state-secret-access-key: ${{ secrets.TERRAFORM_STATE_SECRET_ACCESS_KEY }}
      - name: Build Web
        run: pnpm --filter @life-console/web exec vite build
      - name: Build API
        run: pnpm --filter @life-console/api build
      - name: Upload version without switching traffic
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.TERRAFORM_CLOUDFLARE_API_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/version-upload.jsonl
        run: |
          pnpm --filter @life-console/api exec wrangler versions upload --config "wrangler.${DEPLOY_ENVIRONMENT}.jsonc" --tag "$GITHUB_SHA"
          version_id=$(jq -ers '[.[] | select(.type == "version-upload")][0].version_id | select(type == "string" and length > 0)' "$WRANGLER_OUTPUT_FILE_PATH")
          echo "version-id=$version_id" >> "$GITHUB_OUTPUT"

  migration:
    name: Apply D1 migrations
    needs:
      - detect
      - infra
      - upload
    if: ${{ !cancelled() && !failure() && needs.detect.outputs.migration == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up deployment
        uses: ./.github/actions/setup-deployment
        with:
          environments-json: ${{ secrets.TERRAFORM_ENVIRONMENTS_JSON }}
          state-access-key-id: ${{ secrets.TERRAFORM_STATE_ACCESS_KEY_ID }}
          state-secret-access-key: ${{ secrets.TERRAFORM_STATE_SECRET_ACCESS_KEY }}
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.TERRAFORM_CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @life-console/api exec wrangler d1 migrations apply DB --remote --config "wrangler.${DEPLOY_ENVIRONMENT}.jsonc"

  deploy:
    name: Deploy uploaded version
    needs:
      - detect
      - infra
      - upload
      - migration
    if: ${{ !cancelled() && !failure() && needs.detect.outputs.application == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up deployment
        uses: ./.github/actions/setup-deployment
        with:
          environments-json: ${{ secrets.TERRAFORM_ENVIRONMENTS_JSON }}
          state-access-key-id: ${{ secrets.TERRAFORM_STATE_ACCESS_KEY_ID }}
          state-secret-access-key: ${{ secrets.TERRAFORM_STATE_SECRET_ACCESS_KEY }}
      - name: Switch traffic to uploaded version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.TERRAFORM_CLOUDFLARE_API_TOKEN }}
          VERSION_ID: ${{ needs.upload.outputs.version-id }}
        run: pnpm --filter @life-console/api exec wrangler versions deploy "$VERSION_ID@100%" --yes --config "wrangler.${DEPLOY_ENVIRONMENT}.jsonc"
      - name: Apply public URL and Cron triggers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.TERRAFORM_CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @life-console/api exec wrangler triggers deploy --config "$RUNNER_TEMP/wrangler-triggers.json"
