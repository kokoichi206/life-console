name: Deploy production

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @life-console/web exec playwright install --with-deps chromium

      - name: Run quality checks
        run: pnpm check

      - name: Prepare production configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?production の CLOUDFLARE_ACCOUNT_ID を設定してください}"
          : "${CLOUDFLARE_D1_DATABASE_ID:?production の CLOUDFLARE_D1_DATABASE_ID を設定してください}"
          : "${CLOUDFLARE_R2_BUCKET_NAME:?production の CLOUDFLARE_R2_BUCKET_NAME を設定してください}"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const configPath = 'apps/api/wrangler.production.jsonc';
          const config = JSON.parse(readFileSync(`${configPath}.example`, 'utf8'));
          config.account_id = process.env.CLOUDFLARE_ACCOUNT_ID;
          config.d1_databases[0].database_id = process.env.CLOUDFLARE_D1_DATABASE_ID;
          config.r2_buckets[0].bucket_name = process.env.CLOUDFLARE_R2_BUCKET_NAME;
          // 初回の Access 設定を済ませた既存の本番 Worker を更新する。
          config.workers_dev = true;
          writeFileSync(configPath, `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - name: Validate production build
        run: pnpm --filter @life-console/api exec wrangler deploy --dry-run --config wrangler.production.jsonc

      - name: Apply migrations and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?production の CLOUDFLARE_API_TOKEN を設定してください}"
          pnpm --filter @life-console/api exec wrangler d1 migrations apply DB --remote --config wrangler.production.jsonc
          pnpm --filter @life-console/api exec wrangler deploy --config wrangler.production.jsonc
