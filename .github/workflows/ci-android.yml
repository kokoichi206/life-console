name: ci-android

on:
  push:
    branches:
      - develop
      - main
    paths:
      - "clients/android/**"
      - ".github/workflows/ci-android.yml"
      - ".github/workflows/actions.lock"
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "clients/android/**"
      - ".github/workflows/ci-android.yml"
      - ".github/workflows/actions.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Android quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: clients/android
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: "platforms;android-36 build-tools;35.0.0"

      - name: Run Kotlin lint and custom rule tests
        run: ./gradlew ktlintCheck :lint-rules:test --no-daemon

      - name: Run Android lint, unit tests and debug build
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Upload lint and test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-reports
          path: clients/android/**/build/reports/
          retention-days: 7
