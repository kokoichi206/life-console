name: ci

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check AI harness
        run: pnpm harness:check

      - name: Set up uv for skill tests
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"

      - name: Test health read skill against database migrations
        run: pnpm skills:test

      - name: Check migrations
        run: pnpm migrations:check

      - name: Lint
        run: pnpm lint

      - name: Check unused files, dependencies and exports
        run: pnpm knip

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit and storage tests
        run: pnpm test

      - name: Build Web
        run: pnpm --filter @life-console/web build

      - name: Build API
        run: pnpm --filter @life-console/api build

      - name: Build and smoke-test runner
        run: pnpm --filter @life-console/runner build

      - name: Build Storybook
        run: pnpm storybook:build

      - name: Install Chromium
        run: pnpm --filter @life-console/web exec playwright install --with-deps chromium

      - name: Test Storybook in Chromium
        run: pnpm storybook:test
