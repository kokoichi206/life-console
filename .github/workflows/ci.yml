name: ci

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Quality checks
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --init --ipc=host
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check AI harness
        run: pnpm harness:check

      - name: Set up uv for skill tests
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"

      - name: Test health read skill against database migrations
        run: pnpm skills:test

      - name: Check migrations
        run: pnpm migrations:check

      - name: Lint
        run: pnpm lint

      - name: Check unused files, dependencies and exports
        run: pnpm knip

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit and storage tests
        run: pnpm test

      - name: Build Web
        run: pnpm --filter @life-console/web build

      - name: Build API
        run: pnpm --filter @life-console/api build

      - name: Build and smoke-test runner
        run: pnpm --filter @life-console/runner build

      - name: Build Storybook
        run: pnpm storybook:build

      - name: Test Storybook in Chromium
        run: pnpm storybook:test
